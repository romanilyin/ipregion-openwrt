name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run static checks
        run: |
          scripts/ci/static-checks.sh
          python3 scripts/ci/installer-checks.py

  ucode:
    name: ucode syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config libcurl4-openssl-dev libjson-c-dev nodejs openssl

      - name: Build and test native DNS helper
        run: |
          cc -std=c11 -Wall -Wextra -Werror $(pkg-config --cflags libcurl) ipregion/src/dns-helper.c -o /tmp/ipregion-dns-helper $(pkg-config --libs libcurl)
          python3 scripts/ci/dns-helper-checks.py /tmp/ipregion-dns-helper

      - name: Build local ucode with UCI support
        run: scripts/ci/build-ucode.sh /tmp/ipregion-ucode-install

      - name: Run ucode checks
        run: scripts/ci/ucode-checks.sh /tmp/ipregion-ucode-install/bin/ucode
